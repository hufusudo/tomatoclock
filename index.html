<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TomatoClock</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <p id="storage-warning" hidden>浏览器存储不可用，本次数据不会保存。</p>

  <nav class="app-nav" aria-label="应用导航"><div class="nav-capsule">
    <button id="timer-toggle" class="nav-tab" type="button" aria-controls="clock-view" aria-pressed="true"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M9 2h6M12 9v4l3-3M18 5l2-2"/></svg>计时</button>
    <button id="records-toggle" class="nav-tab" type="button" aria-controls="records-view" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 3v17h17M8 16v-5M13 16V6M18 16v-8"/></svg>统计</button>
    <button id="settings-toggle" class="nav-tab" type="button" aria-controls="settings-view" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="m9 3 1-1h4l1 1 .5 2 2 1 2-.5 2 3-.8 2 0 3 .8 2-2 3-2-.5-2 1-.5 2-1 1h-4l-1-1-.5-2-2-1-2 .5-2-3 .8-2v-3l-.8-2 2-3 2 .5 2-1z"/></svg>设置</button>
  </div></nav>

  <main class="clock" id="clock-view">
    <p id="phase-label">准备开始</p>
    <div id="timer-dial" class="timer-dial" role="progressbar" aria-label="当前时段进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <svg class="dial-ring" viewBox="0 0 320 320" aria-hidden="true"><circle class="dial-track" cx="160" cy="160" r="150"/><circle id="dial-progress" cx="160" cy="160" r="150" pathLength="100"/></svg>
      <div id="time">50:00</div>
    </div>
    <div id="round-dots" role="img" aria-label="轮次进度">
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    </div>

    <div class="controls">
      <button id="start-btn" class="press-button" type="button"><span class="button-face"><svg viewBox="0 0 24 24" aria-hidden="true"><path id="start-icon-path" d="m8 4 12 8-12 8z"/></svg><span id="start-label">开始</span></span></button>
      <button id="pause-btn" class="press-button" type="button" disabled><span class="button-face"><svg viewBox="0 0 24 24" aria-hidden="true"><path id="pause-icon-path" d="M8 4v16M16 4v16"/></svg><span id="pause-label">暂停</span></span></button>
      <button id="reset-btn" class="press-button" type="button"><span class="button-face"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4v6h6M4 10a8 8 0 1 1 0 5"/></svg><span>重置</span></span></button>
    </div>
    <p id="clock-preview" class="clock-preview">短休 10 分 · 长休 30 分</p>
    <p id="notify-hint" hidden>通知被拒绝或不可用：请在浏览器地址栏的锁形图标里允许通知，才能在后台收到提醒。</p>
  </main>

  <section id="settings-view" class="settings-panel" hidden aria-labelledby="settings-title">
    <h1 id="settings-title">设置</h1><p class="page-description">给专注和休息留出适合自己的时间。</p>
    <div class="settings-fields">
      <div class="setting-field"><label for="work-input">工作时长<span>每个完整番茄的专注时间</span></label><div class="number-field"><input id="work-input" type="number" min="1" max="180" step="1" value="50"><span>分钟</span></div></div>
      <div class="setting-field"><label for="short-adj-input">短休微调<span>在工作时长 ÷ 5 的基础上调整</span></label><div class="number-field"><input id="short-adj-input" type="number" min="-5" max="5" step="1" value="0"><span>分钟</span></div></div>
      <div class="setting-field"><label for="long-adj-input">长休微调<span>每四个番茄长休，基础时长为工作 × 0.6</span></label><div class="number-field"><input id="long-adj-input" type="number" min="-5" max="5" step="1" value="0"><span>分钟</span></div></div>
    </div><p id="break-preview" class="settings-preview">短休 10 分 · 长休 30 分</p><p id="settings-state" class="settings-state">修改后自动保存。</p>
  </section>

  <section id="records-view" class="records" hidden aria-labelledby="records-title">
    <div class="records-heading"><h1 id="records-title">统计</h1><button id="records-back" type="button">回到计时</button></div>
    <p class="records-description">每个完成的番茄都会留下记录。</p>
    <div class="records-toolbar"><div class="records-mode" role="group" aria-label="统计方式"><button id="records-day-view" type="button" aria-pressed="true">按天</button><button id="records-week-view" type="button" aria-pressed="false">按周</button></div><div class="records-tools"><button id="legacy-import-btn" type="button" hidden>导入旧记录</button><button id="legacy-export-btn" type="button" hidden>导出学习记录</button></div></div>
    <div id="records-week-filter" class="records-period" hidden><label for="records-month">月份</label><input id="records-month" type="month" min="0001-01" max="9998-12"><label for="records-week">周次</label><select id="records-week"></select></div>
    <section id="week-summary" class="week-summary" hidden aria-labelledby="week-title"><div><h2 id="week-title"></h2><p id="week-range"></p></div><div class="week-study"><span>周总学习时长</span><strong id="week-total"></strong><span id="week-count"></span></div></section>
    <p id="records-week-note" class="records-week-note" hidden>周一至周日，跨月按完整七天统计；第1周为包含当月1日的那一周。</p>
    <div id="import-preview" hidden><p id="import-summary"></p><p class="import-note">同一来源、同一天的旧记录将替换；桌面版记录保留。</p><button id="import-confirm" type="button">确认导入</button><button id="import-cancel" type="button">取消</button></div>
    <div class="records-table"><table><thead><tr><th scope="col">日期</th><th scope="col">番茄数</th><th scope="col">每日总时长</th></tr></thead><tbody id="records-body"></tbody></table></div>
    <div class="records-pages"><button id="records-prev" type="button">上一页</button><p id="records-status" role="status"></p><button id="records-next" type="button">下一页</button></div>
  </section>
  <button id="retry-save-btn" type="button" hidden>重试保存</button>
  <footer>今日 <span id="today-count">0</span> 个番茄 · 累计 <span id="today-time">0 分</span><span class="all-study">历史累计 <span id="all-time">0 分</span></span></footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
