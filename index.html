<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TomatoClock</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <p id="storage-warning" hidden>浏览器存储不可用，本次数据不会保存。</p>

  <nav class="app-nav" aria-label="应用导航"><span class="brand">🍅 TomatoClock</span><button id="records-toggle" type="button">学习记录</button></nav>

  <main class="clock" id="clock-view">
    <p id="phase-label">准备开始</p>
    <div id="time">50:00</div>
    <div id="round-dots" role="img" aria-label="轮次进度">
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    </div>

    <section class="settings" aria-label="设置">
      <div class="settings-row">
        <label for="work-input">工作时长（分钟）</label>
        <input id="work-input" type="number" min="1" max="180" step="1" value="50">
        <label for="short-adj-input">短休微调（分钟）</label>
        <input id="short-adj-input" type="number" min="-5" max="5" step="1" value="0">
        <label for="long-adj-input">长休微调（分钟）</label>
        <input id="long-adj-input" type="number" min="-5" max="5" step="1" value="0">
      </div>
      <p id="break-preview">短休 10 分 · 长休 30 分</p>
    </section>

    <div class="controls">
      <button id="start-btn" type="button">开始番茄</button>
      <button id="pause-btn" type="button" disabled>暂停</button>
      <button id="reset-btn" type="button">重置</button>
    </div>

    <p id="notify-hint" hidden>通知被拒绝或不可用：请在浏览器地址栏的锁形图标里允许通知，才能在后台收到提醒。</p>
  </main>

  <section id="records-view" class="records" hidden aria-labelledby="records-title">
    <div class="records-heading"><h1 id="records-title">学习记录</h1><button id="records-back" type="button">回到计时</button></div>
    <p class="records-description">每个完成的番茄都会留下记录。</p>
    <div class="records-toolbar"><div class="records-mode" role="group" aria-label="统计方式"><button id="records-day-view" type="button" aria-pressed="true">按天</button><button id="records-week-view" type="button" aria-pressed="false">按周</button></div><div class="records-tools"><button id="legacy-import-btn" type="button" hidden>导入旧记录</button><button id="legacy-export-btn" type="button" hidden>导出学习记录</button></div></div>
    <div id="records-week-filter" class="records-period" hidden><label for="records-month">月份</label><input id="records-month" type="month" min="0001-01" max="9998-12"><label for="records-week">周次</label><select id="records-week"></select></div>
    <section id="week-summary" class="week-summary" hidden aria-labelledby="week-title"><div><h2 id="week-title"></h2><p id="week-range"></p></div><div class="week-study"><span>周总学习时长</span><strong id="week-total"></strong><span id="week-count"></span></div></section>
    <p id="records-week-note" class="records-week-note" hidden>周一至周日，跨月按完整七天统计；第1周为包含当月1日的那一周。</p>
    <div id="import-preview" hidden><p id="import-summary"></p><p class="import-note">同一来源、同一天的旧记录将替换；桌面版记录保留。</p><button id="import-confirm" type="button">确认导入</button><button id="import-cancel" type="button">取消</button></div>
    <div class="records-table"><table><thead><tr><th scope="col">日期</th><th scope="col">番茄数</th><th scope="col">每日总时长</th></tr></thead><tbody id="records-body"></tbody></table></div>
    <div class="records-pages"><button id="records-prev" type="button">上一页</button><p id="records-status" role="status"></p><button id="records-next" type="button">下一页</button></div>
  </section>
  <button id="retry-save-btn" type="button" hidden>重试保存</button>
  <footer>今日 <span id="today-count">0</span> 个番茄 · 累计 <span id="today-time">0 分</span><span class="all-study">历史累计 <span id="all-time">0 分</span></span></footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
